<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChinaFit AI - Smart Size & Fit Recommendation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .china-red { color: #E60012; }
        .bg-china-red { background-color: #E60012; }
        .border-china-red { border-color: #E60012; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('shoes');
            const [inputVal1, setInputVal1] = useState(260); // 脚长/身高
            const [inputVal2, setInputVal2] = useState(95);  // 脚宽/体重/腰围
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // 调用真实后端
            const handleCalculate = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                setResult(null);

                try {
                    const response = await fetch('/api/calculate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            category: activeTab,
                            val1: Number(inputVal1),
                            val2: Number(inputVal2)
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (error) {
                    console.error('Backend error:', error);
                    setErrorMsg(`后端请求失败：${error.message}. 请检查网络或稍后再试。`);
                } finally {
                    setLoading(false);
                }
            };

            const handleTabChange = (tab, val1, val2) => {
                setActiveTab(tab);
                setInputVal1(val1);
                setInputVal2(val2);
                setResult(null);
                setErrorMsg('');
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [result, loading, errorMsg]); // 确保图标更新

            return (
                <div className="min-h-screen flex flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
                    {/* 简洁头部 */}
                    <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg bg-china-red flex items-center justify-center font-bold text-white tracking-tighter">AI</div>
                                <span className="text-xl font-bold tracking-tight text-white">ChinaFit <span className="china-red">AI</span></span>
                            </div>
                            <span className="text-xs border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-full">
                                ● Real Backend Active
                            </span>
                        </div>
                    </header>

                    {/* 主计算器 */}
                    <main className="flex-grow flex items-center justify-center py-12 px-4">
                        <div className="w-full max-w-3xl">
                            <div className="text-center mb-8">
                                <h2 className="text-3xl font-bold text-white">Smart Size Calculator</h2>
                                <p className="text-slate-400 mt-2">Enter measurements to get real-time size suggestions from our Node.js backend.</p>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
                                {/* Tabs */}
                                <div className="flex rounded-xl bg-slate-950 p-1.5 mb-8 border border-slate-800">
                                    <button onClick={() => handleTabChange('shoes', 260, 95)} className={`flex-1 py-3 text-sm font-medium rounded-lg transition-all ${activeTab === 'shoes' ? 'bg-china-red text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                        👟 Shoes
                                    </button>
                                    <button onClick={() => handleTabChange('tops', 175, 70)} className={`flex-1 py-3 text-sm font-medium rounded-lg transition-all ${activeTab === 'tops' ? 'bg-china-red text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                        👕 Tops
                                    </button>
                                    <button onClick={() => handleTabChange('pants', 175, 75)} className={`flex-1 py-3 text-sm font-medium rounded-lg transition-all ${activeTab === 'pants' ? 'bg-china-red text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                        👖 Pants
                                    </button>
                                </div>

                                <form onSubmit={handleCalculate} className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">
                                            {activeTab === 'shoes' ? 'Foot Length (mm)' : 'Height (cm)'}
                                        </label>
                                        <input
                                            type="number"
                                            value={inputVal1}
                                            onChange={(e) => setInputVal1(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors"
                                            placeholder={activeTab === 'shoes' ? 'e.g. 260' : 'e.g. 175'}
                                            required
                                            min="1"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">
                                            {activeTab === 'shoes' ? 'Foot Width (mm)' : activeTab === 'tops' ? 'Weight (kg)' : 'Waist (cm)'}
                                        </label>
                                        <input
                                            type="number"
                                            value={inputVal2}
                                            onChange={(e) => setInputVal2(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors"
                                            placeholder={activeTab === 'shoes' ? 'e.g. 95' : activeTab === 'tops' ? 'e.g. 70' : 'e.g. 75'}
                                            required
                                            min="1"
                                        />
                                    </div>
                                    <div className="sm:col-span-2 mt-2">
                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="w-full py-4 rounded-xl bg-china-red text-white font-semibold hover:bg-red-700 transition-all flex items-center justify-center space-x-2 shadow-lg shadow-red-600/20 disabled:opacity-60 disabled:cursor-not-allowed"
                                        >
                                            {loading ? (
                                                <>
                                                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                                    </svg>
                                                    <span>AI calculating...</span>
                                                </>
                                            ) : (
                                                <span>Request Real Backend</span>
                                            )}
                                        </button>
                                    </div>
                                </form>

                                {errorMsg && (
                                    <div className="mt-6 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm animate-fade-in">
                                        ⚠️ {errorMsg}
                                    </div>
                                )}

                                {result && !loading && (
                                    <div className="mt-8 p-6 rounded-xl bg-slate-950 border border-slate-800 animate-fade-in">
                                        <div className="flex items-center justify-between mb-4">
                                            <span className="text-xs uppercase text-emerald-400 font-semibold flex items-center space-x-1">
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                                </svg>
                                                <span>Data from Node.js API · Confidence {result.confidence}</span>
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div className="p-4 rounded-lg bg-slate-900 border border-slate-800">
                                                <span className="text-xs text-slate-400">Recommended Size</span>
                                                <p className="text-2xl font-bold text-white mt-1 china-red">{result.size}</p>
                                            </div>
                                            <div className="p-4 rounded-lg bg-slate-900 border border-slate-800">
                                                <span className="text-xs text-slate-400">Fit Advice</span>
                                                <p className="text-lg font-semibold text-white mt-1">{result.fit}</p>
                                            </div>
                                            {result.extra && (
                                                <div className="sm:col-span-2 p-4 rounded-lg bg-slate-900 border border-slate-800">
                                                    <span className="text-xs text-slate-400">Backend Insights</span>
                                                    <p className="text-sm text-slate-300 mt-1">{result.extra}</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* 简洁 Footer */}
                    <footer className="border-t border-slate-800 py-6 text-center text-sm text-slate-500">
                        © 2026 ChinaFit AI · Powered by React & Vercel Serverless
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
