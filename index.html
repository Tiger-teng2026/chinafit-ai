    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('shoes');
            const [inputVal1, setInputVal1] = useState(260);
            const [inputVal2, setInputVal2] = useState(95);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [isProUser, setIsProUser] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [copied, setCopied] = useState(false);
            const [sellerMsgCopied, setSellerMsgCopied] = useState(false);
            const [showAccessModal, setShowAccessModal] = useState(false);
            const [accessEmail, setAccessEmail] = useState('');
            const [accessStatus, setAccessStatus] = useState('idle');
            const [accessError, setAccessError] = useState('');

            const converter = useMemo(() => {
                if (window.showdown) {
                    return new window.showdown.Converter({
                        tables: true,
                        simplifiedAutoLink: true,
                        strikethrough: true,
                        tasklists: true,
                        ghCodeBlocks: true
                    });
                }
                return null;
            }, []);

            const PRO_TOKEN = 'pro_pass_2026';

            const activateProAccess = () => {
                try {
                    localStorage.setItem('chinafit_pro_token', PRO_TOKEN);
                    localStorage.setItem('isPro', 'true');
                } catch (err) {
                    console.error('Could not persist Pro access:', err);
                }
                setIsProUser(true);
            };

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const paidToken = urlParams.get('paid');
                const storedToken = localStorage.getItem('chinafit_pro_token');
                const storedIsPro = localStorage.getItem('isPro') === 'true';

                if (paidToken === PRO_TOKEN || storedToken === PRO_TOKEN || storedIsPro) {
                    activateProAccess();
                    if (paidToken === PRO_TOKEN) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            }, []);

            const closeAccessModal = () => {
                setShowAccessModal(false);
                setAccessEmail('');
                setAccessStatus('idle');
                setAccessError('');
            };

            const openAccessModal = (e) => {
                if (e) e.preventDefault();
                setAccessEmail('');
                setAccessStatus('idle');
                setAccessError('');
                setShowAccessModal(true);
            };

            const recordEmailLocally = (email, extra = {}) => {
                try {
                    const key = 'chinafit_early_access_leads';
                    const existing = JSON.parse(localStorage.getItem(key) || '[]');
                    existing.push({ email, submittedAt: new Date().toISOString(), ...extra });
                    localStorage.setItem(key, JSON.stringify(existing));
                } catch (err) {
                    console.error('Could not store email locally:', err);
                }
            };

            const handleAccessSubmit = async (e) => {
                e.preventDefault();
                const email = accessEmail.trim().toLowerCase();
                const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

                if (!isValid) {
                    setAccessError('Please enter a valid email address.');
                    setAccessStatus('error');
                    return;
                }

                setAccessStatus('submitting');
                setAccessError('');

                try {
                    const response = await fetch('/api/early-access', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error || 'Could not save your email. Please try again.');
                    }

                    recordEmailLocally(email);
                    activateProAccess();
                    setAccessStatus('success');
                } catch (err) {
                    recordEmailLocally(email, { pendingSync: true });
                    activateProAccess();
                    setAccessStatus('success');
                }
            };

            useEffect(() => {
                if (accessStatus !== 'success') return undefined;
                const timer = setTimeout(() => {
                    closeAccessModal();
                }, 1000);
                return () => clearTimeout(timer);
            }, [accessStatus]);

            useEffect(() => {
                if (!showAccessModal) return;
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';

                const onKeyDown = (event) => {
                    if (event.key === 'Escape') closeAccessModal();
                };
                window.addEventListener('keydown', onKeyDown);

                return () => {
                    document.body.style.overflow = previousOverflow;
                    window.removeEventListener('keydown', onKeyDown);
                };
            }, [showAccessModal]);

            const handleTabChange = (tab, val1, val2) => {
                setActiveTab(tab);
                setInputVal1(val1);
                setInputVal2(val2);
                setResult(null);
                setErrorMsg('');
                setCopied(false);
                setSellerMsgCopied(false);
            };

            const requestSizing = async () => {
                const token = localStorage.getItem('chinafit_pro_token') || '';
                let payload;
                if (activeTab === 'shoes') {
                    payload = { category: 'shoes', footLength: inputVal1, footWidth: inputVal2 };
                } else if (activeTab === 'tops') {
                    payload = { category: 'tops', height: inputVal1, weight: inputVal2 };
                } else {
                    payload = { category: 'pants', height: inputVal1, waist: inputVal2 };
                }

                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-premium-token': token
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `HTTP ${response.status}`);
                }

                return response.json();
            };

            const handleCalculate = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                setResult(null);
                setCopied(false);
                setSellerMsgCopied(false);

                try {
                    const data = await requestSizing();
                    setResult(data);
                } catch (err) {
                    console.error('Request failed:', err);
                    setErrorMsg(err.message || 'Failed to get sizing recommendations. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (!isProUser || !result || result.isPro || loading) return undefined;
                let cancelled = false;

                (async () => {
                    try {
                        const data = await requestSizing();
                        if (!cancelled) setResult(data);
                    } catch (err) {
                        console.error('Pro unlock refresh failed:', err);
                    }
                })();

                return () => { cancelled = true; };
            }, [isProUser]);

            const copyReport = () => {
                if (result && result.proAnalysis) {
                    navigator.clipboard.writeText(result.proAnalysis).then(() => {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                    }).catch(err => console.error('Copy failed:', err));
                }
            };

            const SHARE_TEXT = 'I just used ChinaFit AI to find my perfect Taobao/Poizon size. Check it out!';

            const handleShare = () => {
                const pageUrl = window.location.href;
                if (typeof navigator.share === 'function') {
                    navigator.share({
                        title: 'ChinaFit AI',
                        text: SHARE_TEXT,
                        url: pageUrl
                    }).catch(err => {
                        if (err && err.name !== 'AbortError') {
                            console.error('Share failed:', err);
                        }
                    });
                } else {
                    const shareContent = `${SHARE_TEXT} ${pageUrl}`;
                    navigator.clipboard.writeText(shareContent).then(() => {
                        alert('Link copied to clipboard! Share it anywhere.');
                    }).catch(err => console.error('Copy failed:', err));
                }
            };

            const extractSellerMessage = (markdown) => {
                if (!markdown) return null;
                const startMarkers = ['---SELLER_MESSAGE_START---', '---SELLERMESSAGESTART---'];
                const endMarkers = ['---SELLER_MESSAGE_END---', '---SELLERMESSAGEEND---'];
                let startIdx = -1, endIdx = -1, startMarkerLen = 0;

                for (let i = 0; i < startMarkers.length; i++) {
                    const idx = markdown.indexOf(startMarkers[i]);
                    if (idx !== -1) {
                        startIdx = idx;
                        startMarkerLen = startMarkers[i].length;
                        for (let j = 0; j < endMarkers.length; j++) {
                            const endIdxTmp = markdown.indexOf(endMarkers[j], startIdx + startMarkerLen);
                            if (endIdxTmp !== -1) {
                                endIdx = endIdxTmp;
                                break;
                            }
                        }
                        if (endIdx !== -1) break;
                    }
                }

                if (startIdx === -1 || endIdx === -1 || endIdx <= startIdx) return null;
                const section = markdown.slice(startIdx + startMarkerLen, endIdx).trim();
                const lines = section.split('\n');
                const chineseLines = lines.filter(line => /[\u4e00-\u9fa5]/.test(line));
                const chineseMsg = chineseLines.join(' ').replace(/[*_`>#]/g, '').replace(/\s+/g, ' ').trim();
                return chineseMsg;
            };

            const sellerMsgSection = result?.proAnalysis ? extractSellerMessage(result.proAnalysis) : null;

            const copySellerMsg = () => {
                if (sellerMsgSection) {
                    navigator.clipboard.writeText(sellerMsgSection).then(() => {
                        setSellerMsgCopied(true);
                        setTimeout(() => setSellerMsgCopied(false), 2000);
                    }).catch(err => console.error('Copy failed:', err));
                }
            };

            const getHtmlContent = (markdownText) => {
                if (!markdownText) return '<p class="text-slate-400">No analysis available.</p>';
                
                let cleanMarkdown = markdownText;
                const startMarkers = ['---SELLER_MESSAGE_START---', '---SELLERMESSAGESTART---'];
                const endMarkers = ['---SELLER_MESSAGE_END---', '---SELLERMESSAGEEND---'];
                
                for (let i = 0; i < startMarkers.length; i++) {
                    for (let j = 0; j < endMarkers.length; j++) {
                        const parts = cleanMarkdown.split(startMarkers[i]);
                        if (parts.length > 1) {
                            for (let k = 1; k < parts.length; k++) {
                                const endIdx = parts[k].indexOf(endMarkers[j]);
                                if (endIdx !== -1) {
                                    parts[k] = parts[k].slice(endIdx + endMarkers[j].length);
                                } else {
                                    parts[k] = '';
                                }
                            }
                            cleanMarkdown = parts.join('');
                        }
                    }
                }

                if (converter) return converter.makeHtml(cleanMarkdown);
                const escaped = cleanMarkdown.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre class="text-slate-400 whitespace-pre-wrap">${escaped}</pre>`;
            };

            const getQuickReference = () => {
                const tolerance = activeTab === 'shoes' ? '±5–10 mm' : '±1–2 cm';
                return `Use the target measurements in Section 3 as a baseline to cross-check the seller's actual flat-lay dimensions. Always account for standard manufacturing tolerances (${tolerance}) before finalizing your order.`;
            };

            // 免费用户看到的模糊预览内容
            const renderPreview = () => {
                return (
                    <div className="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-800/50 p-6">
                        <div className="blur-preview space-y-4">
                            <div className="h-4 bg-slate-700 rounded w-3/4"></div>
                            <div className="h-4 bg-slate-700 rounded w-full"></div>
                            <div className="h-4 bg-slate-700 rounded w-5/6"></div>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="h-16 bg-slate-700 rounded"></div>
                                <div className="h-16 bg-slate-700 rounded"></div>
                                <div className="h-16 bg-slate-700 rounded"></div>
                                <div className="h-16 bg-slate-700 rounded"></div>
                            </div>
                            <div className="h-4 bg-slate-700 rounded w-2/3"></div>
                            <div className="h-4 bg-slate-700 rounded w-4/5"></div>
                        </div>
                        <div className="absolute inset-0 flex items-center justify-center">
                            <div className="text-center px-4">
                                <div className="text-2xl mb-2">🔒</div>
                                <h3 className="text-lg font-bold text-white mb-2">Unlock DeepSeek AI Purchase Protection</h3>
                                <p className="text-xs text-slate-400 mb-4 max-w-sm">
                                    Get exact insole / chest / waist targets, platform-specific warnings (Taobao vs Poizon), and a ready-to-send Chinese message to verify with the seller.
                                </p>
                                <button
                                    type="button"
                                    onClick={openAccessModal}
                                    className="inline-block px-6 py-2.5 rounded-lg bg-china-red hover:bg-red-700 font-semibold text-sm text-white shadow-lg shadow-red-600/30 transition active:scale-95"
                                >
                                    Unlock Lifetime Pass for $4.99
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
                    <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg bg-china-red flex items-center justify-center font-bold text-white shadow-md shadow-red-500/20">AI</div>
                                <span className="text-xl font-bold tracking-tight text-white">ChinaFit <span className="china-red">AI</span></span>
                            </div>
                            <div className="flex items-center gap-3">
                                <a href="mailto:support@chinafitai.com" className="hidden md:inline text-xs text-slate-400 hover:text-white underline">support@chinafitai.com</a>
                                {isProUser ? (
                                    <span className="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                        <span className="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span>
                                        Lifetime Pro Active
                                    </span>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={openAccessModal}
                                        className="px-4 py-2 rounded-full bg-china-red text-white text-xs sm:text-sm font-semibold hover:bg-red-700 transition-all shadow-lg shadow-red-600/30 active:scale-95"
                                    >
                                        Get Pro Pass ($4.99)
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow flex items-center justify-center py-10 px-4">
                        <div className="w-full max-w-2xl">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Smart Cross-Border Size Calculator</h1>
                                <p className="text-slate-400 mt-2 text-sm sm:text-base">Never buy the wrong size from Chinese shopping platforms again.</p>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
                                <div className="flex rounded-xl bg-slate-950 p-1 mb-8 border border-slate-800">
                                    <button onClick={() => handleTabChange('shoes', 260, 95)} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'shoes' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>👟 Shoes</button>
                                    <button onClick={() => handleTabChange('tops', 175, 70)} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'tops' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>👕 Tops</button>
                                    <button onClick={() => handleTabChange('pants', 175, 75)} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'pants' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>👖 Pants</button>
                                </div>

                                <form onSubmit={handleCalculate} className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                            {activeTab === 'shoes' ? 'Foot Length (mm)' : 'Height (cm)'}
                                        </label>
                                        <input type="number" value={inputVal1} onChange={(e) => setInputVal1(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors" placeholder={activeTab === 'shoes' ? 'e.g. 260' : 'e.g. 175'} required min="1" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                            {activeTab === 'shoes' ? 'Foot Width (mm)' : activeTab === 'tops' ? 'Weight (kg)' : 'Waist (cm)'}
                                        </label>
                                        <input type="number" value={inputVal2} onChange={(e) => setInputVal2(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors" placeholder={activeTab === 'shoes' ? 'e.g. 95' : activeTab === 'tops' ? 'e.g. 70' : 'e.g. 75'} required min="1" />
                                    </div>
                                    <div className="sm:col-span-2 mt-2">
                                        <button type="submit" disabled={loading} className="w-full py-3.5 rounded-xl bg-china-red text-white font-bold hover:bg-red-700 transition-all flex items-center justify-center space-x-2 shadow-lg shadow-red-600/30 disabled:opacity-60 disabled:cursor-not-allowed active:scale-[0.99]">
                                            {loading ? (
                                                <>
                                                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                                    </svg>
                                                    <span>DeepSeek AI Analyzing...</span>
                                                </>
                                            ) : (
                                                <span>Get Size Recommendation</span>
                                            )}
                                        </button>
                                    </div>
                                </form>

                                {errorMsg && (
                                    <div className="mt-4 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm">⚠️ {errorMsg}</div>
                                )}

                                {result && !loading && (
                                    <div className="mt-8 pt-6 border-t border-slate-800 space-y-6 animate-fade-in">
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="text-xs uppercase font-semibold tracking-wider text-slate-400 mb-1">Recommended Size</div>
                                            <div className="text-3xl font-black text-white">{result.baseResult?.recommendedSize}</div>
                                            <p className="text-sm text-slate-400 mt-2">{result.baseResult?.quickTip}</p>
                                            {result.baseResult?.confidence && (
                                                <p className="text-xs text-slate-500 mt-1 font-medium">Confidence: {result.baseResult.confidence}</p>
                                            )}
                                        </div>

                                        {result.isPro ? (
                                            <>
                                                <div className="bg-gradient-to-br from-slate-900 to-slate-950 p-6 rounded-xl border border-red-500/40 shadow-xl">
                                                    <div className="flex items-center justify-between text-red-400 text-sm font-bold mb-4 pb-2 border-b border-slate-800">
                                                        <div className="flex items-center space-x-2">
                                                            <span>✨ DeepSeek AI Expert Deep Breakdown</span>
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <button onClick={handleShare} className="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                                                                Share
                                                            </button>
                                                            <button onClick={copyReport} className="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                                                                {copied ? '✓ Copied' : '📋 Copy Full Report'}
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div className="markdown-content" dangerouslySetInnerHTML={{ __html: getHtmlContent(result.proAnalysis) }} />
                                                </div>

                                                {sellerMsgSection && (
                                                    <div className="bg-slate-900 p-5 rounded-xl border border-emerald-500/30 shadow-lg">
                                                        <div className="flex items-center justify-between mb-3">
                                                            <h3 className="text-sm font-bold text-emerald-400">💬 Seller Message Template (Copy-Paste to Taobao/1688)</h3>
                                                            <button onClick={copySellerMsg} className="px-3 py-1 text-xs font-semibold rounded bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 transition">
                                                                {sellerMsgCopied ? '✓ Copied' : '📋 Copy Chinese'}
                                                            </button>
                                                        </div>
                                                        <div className="text-sm text-slate-300 bg-slate-950 p-3 rounded-lg border border-slate-800 whitespace-pre-wrap leading-relaxed">
                                                            {sellerMsgSection}
                                                        </div>
                                                        <p className="text-xs text-slate-500 mt-2">
                                                            <span className="font-semibold text-slate-400">📏 Quick Reference:</span> {getQuickReference()}
                                                        </p>
                                                    </div>
                                                )}
                                            </>
                                        ) : isProUser ? (
                                            <div className="rounded-xl border border-slate-700 bg-slate-800/40 p-6 text-center text-sm text-slate-400">
                                                Unlocking full AI report…
                                            </div>
                                        ) : (
                                            renderPreview()
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* FAQ 可见内容区块，提升 SEO 和用户信任 */}
                    <section className="max-w-2xl mx-auto px-4 py-10">
                        <h2 className="text-2xl font-bold text-white mb-6 text-center">Frequently Asked Questions</h2>
                        <div className="space-y-4 text-slate-300">
                            <div>
                                <h3 className="font-semibold text-white">Why do Chinese clothing sizes run smaller than US/EU sizes?</h3>
                                <p className="text-sm mt-1">Chinese clothing is designed for Asian body proportions, so shoulder width, chest, and sleeve length are generally 1–2 sizes smaller than Western standards. Always check flat measurements before buying.</p>
                            </div>
                            <div>
                                <h3 className="font-semibold text-white">How does ChinaFit AI convert Taobao and 1688 sizes?</h3>
                                <p className="text-sm mt-1">ChinaFit AI takes your personal measurements and compares them with the specific size chart from the listing to recommend the best fit, including warnings about platform-specific sizing quirks.</p>
                            </div>
                            <div>
                                <h3 className="font-semibold text-white">How do I convert Chinese shoe sizes to US or EU sizes?</h3>
                                <p className="text-sm mt-1">Chinese shoe sizes use foot length in millimeters. For example, 260 mm = EU 42 / US Men's 8.5. ChinaFit AI also considers foot width for a precise recommendation.</p>
                            </div>
                        </div>                       
                         <p className="text-center mt-6 space-y-2">
                            <a href="/guides/" className="text-red-500 hover:underline">📖 Size conversion guides</a>
                            <span className="text-slate-600 mx-2">·</span>
                            <a href="/blog/" className="text-red-500 hover:underline">Blog</a>
                            <span className="text-slate-600 mx-2">·</span>
                            <a href="/blog/taobao-size-chart.html" className="text-red-500 hover:underline">Taobao size chart</a>
                        </p>
                        <p className="text-center mt-3 text-sm">
                            <a href="/blog/flat-measurements-vs-body-measurements.html" className="text-red-500 hover:underline">Flat vs body measurements</a>
                            <span className="text-slate-600 mx-2">·</span>
                            <a href="/blog/height-weight-size-chart-trap.html" className="text-red-500 hover:underline">Height-weight chart trap</a>
                            <span className="text-slate-600 mx-2">·</span>
                            <a href="/blog/chinese-shoe-sizes-vs-eu.html" className="text-red-500 hover:underline">Chinese vs EU shoes</a>
                        </p>
                        <p className="text-center mt-3">
                            <a href="/blog/my-journey-building-chinafit-ai.html" className="text-red-500 hover:underline">🔥 Read the story behind ChinaFit AI</a>
                        </p>
                    </section>

                    {showAccessModal && (
                        <div
                            className="early-access-overlay fixed inset-0 z-[100] flex items-center justify-center p-4"
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="early-access-title"
                        >
                            <div className="absolute inset-0 bg-black/75 backdrop-blur-md" onClick={closeAccessModal}></div>
                            <div className="early-access-modal relative w-full max-w-md rounded-2xl border border-white/10 bg-gradient-to-b from-zinc-900/95 via-zinc-950/95 to-black/95 p-6 sm:p-8 shadow-[0_24px_80px_rgba(0,0,0,0.65)]">
                                <button
                                    type="button"
                                    onClick={closeAccessModal}
                                    className="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition"
                                    aria-label="Close"
                                >
                                    ✕
                                </button>
                                {accessStatus === 'success' ? (
                                    <div className="text-center py-6">
                                        <div className="mx-auto mb-4 w-14 h-14 rounded-full bg-emerald-500/15 border border-emerald-400/30 flex items-center justify-center text-2xl">✓</div>
                                        <h2 id="early-access-title" className="text-2xl font-extrabold text-white mb-2">Success!</h2>
                                        <p className="text-sm text-slate-300 leading-relaxed">Pro access is unlocked. Enjoy the full calculator.</p>
                                    </div>
                                ) : (
                                    <>
                                        <h2 id="early-access-title" className="text-2xl sm:text-[1.7rem] font-extrabold text-white mb-3 leading-tight">
                                            🎉 Early Access Special
                                        </h2>
                                        <p className="text-sm text-slate-300 leading-relaxed mb-6">
                                            We are upgrading our checkout system. Enter your email below to get Free Pro Access for your first month!
                                        </p>
                                        <form onSubmit={handleAccessSubmit} className="space-y-3">
                                            <label htmlFor="early-access-email" className="sr-only">Email</label>
                                            <input
                                                id="early-access-email"
                                                type="email"
                                                required
                                                autoComplete="email"
                                                autoFocus
                                                value={accessEmail}
                                                onChange={(e) => {
                                                    setAccessEmail(e.target.value);
                                                    if (accessError) setAccessError('');
                                                }}
                                                placeholder="you@email.com"
                                                className="w-full rounded-xl bg-black/55 border border-white/15 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500/40"
                                            />
                                            {accessError && <p className="text-xs text-red-400">{accessError}</p>}
                                            <button
                                                type="submit"
                                                disabled={accessStatus === 'submitting'}
                                                className="w-full py-3 rounded-xl bg-china-red hover:bg-red-700 disabled:opacity-70 font-semibold text-sm text-white shadow-lg shadow-red-600/30 transition active:scale-[0.98]"
                                            >
                                                {accessStatus === 'submitting' ? 'Sending…' : 'Get Free Pro'}
                                            </button>
                                        </form>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-800 py-8 text-center text-xs text-slate-500">
                        <p className="mb-3">
                            Customer support: <a href="mailto:support@chinafitai.com" className="text-slate-300 hover:text-white underline">support@chinafitai.com</a>
                        </p>
                        <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 mb-3">
                            <a href="/guides/" className="text-slate-400 hover:text-white underline">Size Guides</a>
                            <a href="/blog/" className="text-slate-400 hover:text-white underline">Blog</a>
                            <a href="/privacy.html" className="text-slate-400 hover:text-white underline">Privacy Policy</a>
                            <a href="/terms.html" className="text-slate-400 hover:text-white underline">Terms of Service</a>
                            <a href="/acceptable-use.html" className="text-slate-400 hover:text-white underline">Acceptable Use Policy</a>
                            <a href="/contact.html" className="text-slate-400 hover:text-white underline">Contact</a>
                        </div>
                        <p>© 2026 ChinaFit AI · Built with React & DeepSeek Engine</p>
                        <p className="text-[11px] text-slate-600 mt-2 max-w-xl mx-auto px-4">
                            Disclaimer: ChinaFit AI provides size estimations for reference only. Actual garment and shoe dimensions may vary by manufacturer tolerances (typically ±5–10 mm for shoes and ±1–2 cm for clothing). By using this AI sizing service, you agree to our Terms of Service and Acceptable Use Policy.
                        </p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
