<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChinaFit AI - Smart Size Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .china-red { color: #E60012; }
        .bg-china-red { background-color: #E60012; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CREEM_PAYMENT_URL = 'https://www.creem.io/payment/prod_3QstQYL7PxXPdFQJ9GWMlA';

        function App() {
            const [activeTab, setActiveTab] = useState('shoes');
            const [inputVal1, setInputVal1] = useState(260); // 脚长或身高
            const [inputVal2, setInputVal2] = useState(95);  // 脚宽或体重/腰围
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [isProUser, setIsProUser] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const paidToken = urlParams.get('paid');

                if (paidToken === 'pro_pass_2026' || localStorage.getItem('chinafit_pro_token') === 'pro_pass_2026') {
                    localStorage.setItem('chinafit_pro_token', 'pro_pass_2026');
                    setIsProUser(true);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            const handleTabChange = (tab, val1, val2) => {
                setActiveTab(tab);
                setInputVal1(val1);
                setInputVal2(val2);
                setResult(null);
                setErrorMsg('');
            };

            const handleCalculate = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                setResult(null);

                const token = localStorage.getItem('chinafit_pro_token') || '';

                try {
                    let payload;
                    if (activeTab === 'shoes') {
                        payload = { category: 'shoes', footLength: inputVal1, footWidth: inputVal2 };
                    } else if (activeTab === 'tops') {
                        payload = { category: 'tops', height: inputVal1, weight: inputVal2 };
                    } else {
                        payload = { category: 'pants', height: inputVal1, waist: inputVal2 };
                    }

                    const response = await fetch('/api/calculate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-premium-token': token
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    console.error('Request failed:', err);
                    setErrorMsg(err.message || 'Failed to get sizing recommendations. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
                    <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg bg-china-red flex items-center justify-center font-bold text-white">AI</div>
                                <span className="text-xl font-bold text-white">ChinaFit <span className="china-red">AI</span></span>
                            </div>
                            {isProUser ? (
                                <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                    <span className="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span>
                                    Lifetime Pro Active
                                </span>
                            ) : (
                                <a
                                    href={CREEM_PAYMENT_URL}
                                    className="px-4 py-2 rounded-full bg-china-red text-white text-sm font-medium hover:bg-red-700 transition-all shadow-lg shadow-red-600/20"
                                >
                                    Get Pro Pass ($4.99)
                                </a>
                            )}
                        </div>
                    </header>

                    <main className="flex-grow flex items-center justify-center py-12 px-4">
                        <div className="w-full max-w-3xl">
                            <div className="text-center mb-8">
                                <h2 className="text-3xl font-bold text-white">Smart Cross-Border Size Calculator</h2>
                                <p className="text-slate-400 mt-2">Never buy the wrong size from Chinese shopping platforms again.</p>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
                                <div className="flex rounded-xl bg-slate-950 p-1.5 mb-8 border border-slate-800">
                                    <button onClick={() => handleTabChange('shoes', 260, 95)} className={`flex-1 py-3 text-sm font-medium rounded-lg transition-all ${activeTab === 'shoes' ? 'bg-china-red text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                        <i data-lucide="footprints" className="w-4 h-4 mr-2"></i> Shoes
                                    </button>
                                    <button onClick={() => handleTabChange('tops', 175, 70)} className={`flex-1 py-3 text-sm font-medium rounded-lg transition-all ${activeTab === 'tops' ? 'bg-china-red text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                        <i data-lucide="shirt" className="w-4 h-4 mr-2"></i> Tops
                                    </button>
                                    <button onClick={() => handleTabChange('pants', 175, 75)} className={`flex-1 py-3 text-sm font-medium rounded-lg transition-all ${activeTab === 'pants' ? 'bg-china-red text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                        <i data-lucide="component" className="w-4 h-4 mr-2"></i> Pants
                                    </button>
                                </div>

                                <form onSubmit={handleCalculate} className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">
                                            {activeTab === 'shoes' ? 'Foot Length (mm)' : 'Height (cm)'}
                                        </label>
                                        <input
                                            type="number"
                                            value={inputVal1}
                                            onChange={(e) => setInputVal1(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors"
                                            placeholder={activeTab === 'shoes' ? 'e.g. 260' : 'e.g. 175'}
                                            required
                                            min="1"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">
                                            {activeTab === 'shoes' ? 'Foot Width (mm)' : activeTab === 'tops' ? 'Weight (kg)' : 'Waist (cm)'}
                                        </label>
                                        <input
                                            type="number"
                                            value={inputVal2}
                                            onChange={(e) => setInputVal2(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors"
                                            placeholder={activeTab === 'shoes' ? 'e.g. 95' : activeTab === 'tops' ? 'e.g. 70' : 'e.g. 75'}
                                            required
                                            min="1"
                                        />
                                    </div>
                                    <div className="sm:col-span-2 mt-2">
                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="w-full py-4 rounded-xl bg-china-red text-white font-semibold hover:bg-red-700 transition-all flex items-center justify-center space-x-2 shadow-lg shadow-red-600/20 disabled:opacity-60 disabled:cursor-not-allowed"
                                        >
                                            {loading ? (
                                                <>
                                                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                                    </svg>
                                                    <span>AI Calculating...</span>
                                                </>
                                            ) : (
                                                <span>Get Size Recommendation</span>
                                            )}
                                        </button>
                                    </div>
                                </form>

                                {errorMsg && (
                                    <div className="mt-4 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                                        ⚠️ {errorMsg}
                                    </div>
                                )}

                                {result && !loading && (
                                    <div className="mt-8 pt-6 border-t border-slate-800 space-y-6 animate-fade-in">
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="text-xs uppercase tracking-wider text-slate-400 mb-1">Recommended Size</div>
                                            <div className="text-3xl font-black text-white">{result.baseResult?.recommendedSize}</div>
                                            <p className="text-sm text-slate-400 mt-2">{result.baseResult?.quickTip}</p>
                                            {result.baseResult?.confidence && (
                                                <p className="text-xs text-slate-500 mt-1">Confidence: {result.baseResult.confidence}</p>
                                            )}
                                        </div>

                                        {result.isPro ? (
                                            <div className="bg-gradient-to-br from-slate-900 to-slate-800 p-5 rounded-xl border border-red-500/30 shadow-lg">
                                                <div className="flex items-center space-x-2 text-red-400 text-sm font-bold mb-3">
                                                    <span>✨ DeepSeek AI Expert Analysis</span>
                                                </div>
                                                <div className="text-sm text-slate-300 leading-relaxed whitespace-pre-line">
                                                    {result.proAnalysis}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="relative overflow-hidden rounded-xl border border-slate-700 bg-gradient-to-b from-slate-800 to-slate-900 p-6 text-center">
                                                <div className="text-2xl mb-2">🔒</div>
                                                <h3 className="text-lg font-bold text-white mb-2">Unlock In-Depth AI Fit Analysis</h3>
                                                <p className="text-xs text-slate-400 mb-4 max-w-sm mx-auto">
                                                    Get platform-specific fit warnings (Taobao/Poizon/1688), body measurement checks & shrinkage alerts.
                                                </p>
                                                <a
                                                    href={CREEM_PAYMENT_URL}
                                                    className="inline-block px-6 py-2.5 rounded-lg bg-china-red hover:bg-red-700 font-semibold text-sm text-white shadow-lg shadow-red-600/20 transition"
                                                >
                                                    Unlock Lifetime Pass for $4.99
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="border-t border-slate-800 py-6 text-center text-sm text-slate-500">
                        © 2026 ChinaFit AI · Built with React & DeepSeek Engine
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
