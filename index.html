<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChinaFit AI - Smart Cross-Border Size Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入稳定版 marked 渲染器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .china-red { color: #E60012; }
        .bg-china-red { background-color: #E60012; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 专门针对 Markdown 报告的排版样式 */
        .markdown-body { color: #cbd5e1; font-size: 0.875rem; line-height: 1.6; }
        .markdown-body h1 { font-size: 1.2rem; font-weight: 700; color: #ffffff; margin-top: 1rem; margin-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.05rem; font-weight: 700; color: #f87171; margin-top: 1.25rem; margin-bottom: 0.5rem; border-bottom: 1px solid #334155; padding-bottom: 0.35rem; }
        .markdown-body h3 { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; margin-top: 1rem; margin-bottom: 0.35rem; }
        .markdown-body p { margin-bottom: 0.75rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body li { margin-bottom: 0.35rem; }
        .markdown-body strong { color: #ffffff; font-weight: 600; }
        .markdown-body blockquote { border-left: 3px solid #ef4444; padding-left: 0.75rem; color: #94a3b8; margin: 0.75rem 0; background: rgba(239, 68, 68, 0.05); padding-top: 0.25rem; padding-bottom: 0.25rem; border-radius: 0 0.375rem 0.375rem 0; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.825rem; }
        .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.5rem 0.75rem; text-align: left; }
        .markdown-body th { background-color: #0f172a; color: #f87171; font-weight: 600; }
        .markdown-body tr:nth-child(even) { background-color: rgba(15, 23, 42, 0.5); }
        .markdown-body hr { border: 0; border-top: 1px solid #334155; margin: 1.25rem 0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CREEM_PAYMENT_URL = 'https://www.creem.io/payment/prod_3QstQYL7PxXPdFQJ9GWMlA';

        function App() {
            const [activeTab, setActiveTab] = useState('shoes');
            const [inputVal1, setInputVal1] = useState(260); // 脚长或身高
            const [inputVal2, setInputVal2] = useState(95);  // 脚宽或体重/腰围
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [isProUser, setIsProUser] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // 检查 Pro 激活状态（支持 URL 参数和 localStorage）
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const paidToken = urlParams.get('paid');

                if (paidToken === 'pro_pass_2026' || localStorage.getItem('chinafit_pro_token') === 'pro_pass_2026') {
                    localStorage.setItem('chinafit_pro_token', 'pro_pass_2026');
                    setIsProUser(true);
                    if (paidToken) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            }, []);

            const handleTabChange = (tab, val1, val2) => {
                setActiveTab(tab);
                setInputVal1(val1);
                setInputVal2(val2);
                setResult(null);
                setErrorMsg('');
            };

            const handleCalculate = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                setResult(null);

                const token = localStorage.getItem('chinafit_pro_token') || '';

                try {
                    // 正确区分品类，pants 发送 waist 而不是 weight
                    let payload;
                    if (activeTab === 'shoes') {
                        payload = { category: 'shoes', footLength: inputVal1, footWidth: inputVal2 };
                    } else if (activeTab === 'tops') {
                        payload = { category: 'tops', height: inputVal1, weight: inputVal2 };
                    } else {
                        payload = { category: 'pants', height: inputVal1, waist: inputVal2 };
                    }

                    const response = await fetch('/api/calculate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-premium-token': token
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    console.error('Request failed:', err);
                    setErrorMsg(err.message || 'Failed to get sizing recommendations. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            // 使用 marked 解析 Markdown，若未加载则原样显示
            const formatMarkdown = (content) => {
                if (!content) return { __html: '' };
                try {
                    if (window.marked && typeof window.marked.parse === 'function') {
                        return { __html: window.marked.parse(content) };
                    }
                } catch (e) {
                    console.error('Marked parse error:', e);
                }
                return { __html: content };
            };

            return (
                <div className="min-h-screen flex flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
                    <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg bg-china-red flex items-center justify-center font-bold text-white shadow-md shadow-red-500/20">AI</div>
                                <span className="text-xl font-bold tracking-tight text-white">ChinaFit <span className="china-red">AI</span></span>
                            </div>
                            {isProUser ? (
                                <span className="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                    <span className="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span>
                                    Lifetime Pro Active
                                </span>
                            ) : (
                                <a
                                    href={CREEM_PAYMENT_URL}
                                    className="px-4 py-2 rounded-full bg-china-red text-white text-xs sm:text-sm font-semibold hover:bg-red-700 transition-all shadow-lg shadow-red-600/30 active:scale-95"
                                >
                                    Get Pro Pass ($4.99)
                                </a>
                            )}
                        </div>
                    </header>

                    <main className="flex-grow flex items-center justify-center py-10 px-4">
                        <div className="w-full max-w-2xl">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Smart Cross-Border Size Calculator</h1>
                                <p className="text-slate-400 mt-2 text-sm sm:text-base">Never buy the wrong size from Chinese shopping platforms again.</p>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
                                <div className="flex rounded-xl bg-slate-950 p-1 mb-8 border border-slate-800">
                                    <button
                                        onClick={() => handleTabChange('shoes', 260, 95)}
                                        className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'shoes' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        👟 Shoes
                                    </button>
                                    <button
                                        onClick={() => handleTabChange('tops', 175, 70)}
                                        className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'tops' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        👕 Tops
                                    </button>
                                    <button
                                        onClick={() => handleTabChange('pants', 175, 75)}
                                        className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'pants' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        👖 Pants
                                    </button>
                                </div>

                                <form onSubmit={handleCalculate} className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                            {activeTab === 'shoes' ? 'Foot Length (mm)' : 'Height (cm)'}
                                        </label>
                                        <input
                                            type="number"
                                            value={inputVal1}
                                            onChange={(e) => setInputVal1(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors"
                                            placeholder={activeTab === 'shoes' ? 'e.g. 260' : 'e.g. 175'}
                                            required
                                            min="1"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                            {activeTab === 'shoes' ? 'Foot Width (mm)' : activeTab === 'tops' ? 'Weight (kg)' : 'Waist (cm)'}
                                        </label>
                                        <input
                                            type="number"
                                            value={inputVal2}
                                            onChange={(e) => setInputVal2(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors"
                                            placeholder={activeTab === 'shoes' ? 'e.g. 95' : activeTab === 'tops' ? 'e.g. 70' : 'e.g. 75'}
                                            required
                                            min="1"
                                        />
                                    </div>
                                    <div className="sm:col-span-2 mt-2">
                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="w-full py-3.5 rounded-xl bg-china-red text-white font-bold hover:bg-red-700 transition-all flex items-center justify-center space-x-2 shadow-lg shadow-red-600/30 disabled:opacity-60 disabled:cursor-not-allowed active:scale-[0.99]"
                                        >
                                            {loading ? (
                                                <>
                                                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                                    </svg>
                                                    <span>DeepSeek AI Analyzing...</span>
                                                </>
                                            ) : (
                                                <span>Get Size Recommendation</span>
                                            )}
                                        </button>
                                    </div>
                                </form>

                                {errorMsg && (
                                    <div className="mt-4 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                                        ⚠️ {errorMsg}
                                    </div>
                                )}

                                {result && !loading && (
                                    <div className="mt-8 pt-6 border-t border-slate-800 space-y-6 animate-fade-in">
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="text-xs uppercase font-semibold tracking-wider text-slate-400 mb-1">Recommended Size</div>
                                            <div className="text-3xl font-black text-white">{result.baseResult?.recommendedSize}</div>
                                            <p className="text-sm text-slate-400 mt-2">{result.baseResult?.quickTip}</p>
                                            {result.baseResult?.confidence && (
                                                <p className="text-xs text-slate-500 mt-1 font-medium">Confidence: {result.baseResult.confidence}</p>
                                            )}
                                        </div>

                                        {result.isPro ? (
                                            <div className="bg-gradient-to-br from-slate-900 to-slate-950 p-6 rounded-xl border border-red-500/40 shadow-xl">
                                                <div className="flex items-center space-x-2 text-red-400 text-sm font-bold mb-4 pb-2 border-b border-slate-800">
                                                    <span>✨ DeepSeek AI Expert Deep Breakdown</span>
                                                </div>
                                                <div
                                                    className="markdown-body"
                                                    dangerouslySetInnerHTML={formatMarkdown(result.proAnalysis)}
                                                />
                                            </div>
                                        ) : (
                                            <div className="relative overflow-hidden rounded-xl border border-slate-700 bg-gradient-to-b from-slate-800 to-slate-900 p-6 text-center">
                                                <div className="text-2xl mb-2">🔒</div>
                                                <h3 className="text-base font-bold text-white mb-1">Unlock In-Depth DeepSeek AI Analysis</h3>
                                                <p className="text-xs text-slate-400 mb-4 max-w-sm mx-auto">
                                                    Get brand comparisons (Taobao vs Dewu/Nike), insole tolerance charts & shrinkage warnings.
                                                </p>
                                                <a
                                                    href={CREEM_PAYMENT_URL}
                                                    className="inline-block px-6 py-2.5 rounded-lg bg-china-red hover:bg-red-700 font-semibold text-xs sm:text-sm text-white shadow-lg shadow-red-600/30 transition active:scale-95"
                                                >
                                                    Unlock Lifetime Pass for $4.99
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
                        © 2026 ChinaFit AI · Built with React & DeepSeek Engine
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
