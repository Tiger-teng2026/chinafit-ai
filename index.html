<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Core SEO Meta Tags -->
        <title>Taobao Size Converter – Convert Chinese Clothing & Shoe Sizes to US/EU</title>
        <meta name="description" content="Free AI-powered tool to convert Chinese shoe and clothing sizes from Taobao, 1688, Poizon to US, EU, UK sizes. Avoid size mistakes – get your perfect fit now.">
        <meta name="keywords" content="Taobao size converter, Poizon size chart, 1688 clothing size, Chinese shoe size calculator, Dewu size guide, cross-border shopping sizing">
        <link rel="canonical" href="https://www.chinafitai.com/" />
    
        <!-- Open Graph / Social Media Share Meta Tags -->
        <meta property="og:title" content="ChinaFit AI - Smart Cross-Border Size Calculator">
        <meta property="og:description" content="Accurate shoe and clothing size conversions for cross-border shopping on Taobao, Dewu, and 1688 powered by DeepSeek AI.">
        <meta property="og:url" content="https://www.chinafitai.com/">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="ChinaFit AI">
    
        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="ChinaFit AI - Smart Cross-Border Size Calculator">
        <meta name="twitter:description" content="Never buy the wrong size from Chinese shopping platforms again. Get exact sizing recommendations instantly.">

        <!-- Google Rich Snippets / Schema.org JSON-LD -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "ChinaFit AI",
          "url": "https://www.chinafitai.com/",
          "description": "Free AI-powered clothing and shoe size converter for overseas shoppers buying on Taobao, 1688, Poizon, and JD.com.",
          "applicationCategory": "ShoppingApplication",
          "operatingSystem": "All",
          "offers": {
            "@type": "Offer",
            "price": "4.99",
            "priceCurrency": "USD"
          }
        }
        </script>
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Why do Chinese clothing sizes run smaller than US/EU sizes?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Chinese clothing sizes are cut for Asian body proportions, meaning shoulder width, chest, and sleeve length are typically 1–2 sizes smaller than US/UK/EU standards. Always check flat measurements before ordering."
              }
            },
            {
              "@type": "Question",
              "name": "How does ChinaFit AI convert Taobao and 1688 sizes?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "ChinaFit AI uses your personal measurements (height, weight, foot length, etc.) and compares them with the specific size chart from Taobao, 1688, Poizon, or JD.com to recommend the best fit."
              }
            },
            {
              "@type": "Question",
              "name": "How do I convert Chinese shoe sizes to US or EU sizes?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Chinese shoe sizes usually use foot length in millimeters. For example, 260 mm is about EU 42 / US Men's 8.5. ChinaFit AI also considers foot width and instep height for a more accurate fit."
              }
            }
          ]
        }
        </script>

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
        
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
            body { font-family: 'Inter', sans-serif; }
            .china-red { color: #E60012; }
            .bg-china-red { background-color: #E60012; }
            .animate-fade-in { animation: fadeIn 0.4s ease-out; }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(8px); }
                to { opacity: 1; transform: translateY(0); }
            }
    
            .markdown-content h1 { font-size: 1.3rem !important; font-weight: 800 !important; color: #ffffff !important; margin: 1.2rem 0 0.6rem 0 !important; }
            .markdown-content h2 { font-size: 1.15rem !important; font-weight: 700 !important; color: #f87171 !important; margin: 1.4rem 0 0.6rem 0 !important; border-bottom: 1px solid #334155 !important; padding-bottom: 0.4rem !important; }
            .markdown-content h3 { font-size: 1rem !important; font-weight: 600 !important; color: #e2e8f0 !important; margin: 1.1rem 0 0.4rem 0 !important; }
            .markdown-content p { color: #cbd5e1 !important; font-size: 0.875rem !important; line-height: 1.65 !important; margin-bottom: 0.75rem !important; }
            .markdown-content strong { color: #ffffff !important; font-weight: 700 !important; }
            .markdown-content ul { list-style-type: disc !important; padding-left: 1.25rem !important; margin: 0.5rem 0 0.8rem 0 !important; color: #cbd5e1 !important; font-size: 0.875rem !important; }
            .markdown-content li { margin-bottom: 0.35rem !important; }
            .markdown-content table { width: 100% !important; border-collapse: collapse !important; margin: 1rem 0 !important; font-size: 0.825rem !important; background: rgba(15, 23, 42, 0.7) !important; border-radius: 8px !important; overflow: hidden !important; border: 1px solid #334155 !important; }
            .markdown-content th { background-color: #1e293b !important; color: #f87171 !important; font-weight: 700 !important; text-align: left !important; padding: 0.6rem 0.75rem !important; border: 1px solid #334155 !important; }
            .markdown-content td { padding: 0.55rem 0.75rem !important; border: 1px solid #334155 !important; color: #cbd5e1 !important; }
            .markdown-content tr:nth-child(even) { background-color: rgba(30, 41, 59, 0.4) !important; }
            .markdown-content hr { border: 0 !important; border-top: 1px solid #334155 !important; margin: 1.5rem 0 !important; }
            
            /* 付费锁模糊效果 */
            .blur-preview {
                filter: blur(8px);
                user-select: none;
                pointer-events: none;
            }
        </style>
    </head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CREEM_PAYMENT_URL = 'https://www.creem.io/payment/prod_2oD95EVLaTLVVVpIi9brWq';

        function App() {
            const [activeTab, setActiveTab] = useState('shoes');
            const [inputVal1, setInputVal1] = useState(260);
            const [inputVal2, setInputVal2] = useState(95);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [isProUser, setIsProUser] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [copied, setCopied] = useState(false);
            const [sellerMsgCopied, setSellerMsgCopied] = useState(false);

            const converter = useMemo(() => {
                if (window.showdown) {
                    return new window.showdown.Converter({
                        tables: true,
                        simplifiedAutoLink: true,
                        strikethrough: true,
                        tasklists: true,
                        ghCodeBlocks: true
                    });
                }
                return null;
            }, []);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const paidToken = urlParams.get('paid');

                if (paidToken === 'pro_pass_2026') {
                    localStorage.setItem('chinafit_pro_token', 'pro_pass_2026');
                    setIsProUser(true);
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else if (localStorage.getItem('chinafit_pro_token') === 'pro_pass_2026') {
                    setIsProUser(true);
                }
            }, []);

            const handleTabChange = (tab, val1, val2) => {
                setActiveTab(tab);
                setInputVal1(val1);
                setInputVal2(val2);
                setResult(null);
                setErrorMsg('');
                setCopied(false);
                setSellerMsgCopied(false);
            };

            const handleCalculate = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                setResult(null);
                setCopied(false);
                setSellerMsgCopied(false);

                const token = localStorage.getItem('chinafit_pro_token') || '';

                try {
                    let payload;
                    if (activeTab === 'shoes') {
                        payload = { category: 'shoes', footLength: inputVal1, footWidth: inputVal2 };
                    } else if (activeTab === 'tops') {
                        payload = { category: 'tops', height: inputVal1, weight: inputVal2 };
                    } else {
                        payload = { category: 'pants', height: inputVal1, waist: inputVal2 };
                    }

                    const response = await fetch('/api/calculate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-premium-token': token
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    console.error('Request failed:', err);
                    setErrorMsg(err.message || 'Failed to get sizing recommendations. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const copyReport = () => {
                if (result && result.proAnalysis) {
                    navigator.clipboard.writeText(result.proAnalysis).then(() => {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                    }).catch(err => console.error('Copy failed:', err));
                }
            };

            const SHARE_TEXT = 'I just used ChinaFit AI to find my perfect Taobao/Poizon size. Check it out!';

            const handleShare = () => {
                const pageUrl = window.location.href;
                if (typeof navigator.share === 'function') {
                    navigator.share({
                        title: 'ChinaFit AI',
                        text: SHARE_TEXT,
                        url: pageUrl
                    }).catch(err => {
                        if (err && err.name !== 'AbortError') {
                            console.error('Share failed:', err);
                        }
                    });
                } else {
                    const shareContent = `${SHARE_TEXT} ${pageUrl}`;
                    navigator.clipboard.writeText(shareContent).then(() => {
                        alert('Link copied to clipboard! Share it anywhere.');
                    }).catch(err => console.error('Copy failed:', err));
                }
            };

            const extractSellerMessage = (markdown) => {
                if (!markdown) return null;
                const startMarkers = ['---SELLER_MESSAGE_START---', '---SELLERMESSAGESTART---'];
                const endMarkers = ['---SELLER_MESSAGE_END---', '---SELLERMESSAGEEND---'];
                let startIdx = -1, endIdx = -1, startMarkerLen = 0;

                for (let i = 0; i < startMarkers.length; i++) {
                    const idx = markdown.indexOf(startMarkers[i]);
                    if (idx !== -1) {
                        startIdx = idx;
                        startMarkerLen = startMarkers[i].length;
                        for (let j = 0; j < endMarkers.length; j++) {
                            const endIdxTmp = markdown.indexOf(endMarkers[j], startIdx + startMarkerLen);
                            if (endIdxTmp !== -1) {
                                endIdx = endIdxTmp;
                                break;
                            }
                        }
                        if (endIdx !== -1) break;
                    }
                }

                if (startIdx === -1 || endIdx === -1 || endIdx <= startIdx) return null;
                const section = markdown.slice(startIdx + startMarkerLen, endIdx).trim();
                const lines = section.split('\n');
                const chineseLines = lines.filter(line => /[\u4e00-\u9fa5]/.test(line));
                const chineseMsg = chineseLines.join(' ').replace(/[*_`>#]/g, '').replace(/\s+/g, ' ').trim();
                return chineseMsg;
            };

            const sellerMsgSection = result?.proAnalysis ? extractSellerMessage(result.proAnalysis) : null;

            const copySellerMsg = () => {
                if (sellerMsgSection) {
                    navigator.clipboard.writeText(sellerMsgSection).then(() => {
                        setSellerMsgCopied(true);
                        setTimeout(() => setSellerMsgCopied(false), 2000);
                    }).catch(err => console.error('Copy failed:', err));
                }
            };

            const getHtmlContent = (markdownText) => {
                if (!markdownText) return '<p class="text-slate-400">No analysis available.</p>';
                
                let cleanMarkdown = markdownText;
                const startMarkers = ['---SELLER_MESSAGE_START---', '---SELLERMESSAGESTART---'];
                const endMarkers = ['---SELLER_MESSAGE_END---', '---SELLERMESSAGEEND---'];
                
                for (let i = 0; i < startMarkers.length; i++) {
                    for (let j = 0; j < endMarkers.length; j++) {
                        const parts = cleanMarkdown.split(startMarkers[i]);
                        if (parts.length > 1) {
                            for (let k = 1; k < parts.length; k++) {
                                const endIdx = parts[k].indexOf(endMarkers[j]);
                                if (endIdx !== -1) {
                                    parts[k] = parts[k].slice(endIdx + endMarkers[j].length);
                                } else {
                                    parts[k] = '';
                                }
                            }
                            cleanMarkdown = parts.join('');
                        }
                    }
                }

                if (converter) return converter.makeHtml(cleanMarkdown);
                const escaped = cleanMarkdown.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre class="text-slate-400 whitespace-pre-wrap">${escaped}</pre>`;
            };

            const getQuickReference = () => {
                const tolerance = activeTab === 'shoes' ? '±5–10 mm' : '±1–2 cm';
                return `Use the target measurements in Section 3 as a baseline to cross-check the seller's actual flat-lay dimensions. Always account for standard manufacturing tolerances (${tolerance}) before finalizing your order.`;
            };

            // 免费用户看到的模糊预览内容
            const renderPreview = () => {
                return (
                    <div className="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-800/50 p-6">
                        <div className="blur-preview space-y-4">
                            <div className="h-4 bg-slate-700 rounded w-3/4"></div>
                            <div className="h-4 bg-slate-700 rounded w-full"></div>
                            <div className="h-4 bg-slate-700 rounded w-5/6"></div>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="h-16 bg-slate-700 rounded"></div>
                                <div className="h-16 bg-slate-700 rounded"></div>
                                <div className="h-16 bg-slate-700 rounded"></div>
                                <div className="h-16 bg-slate-700 rounded"></div>
                            </div>
                            <div className="h-4 bg-slate-700 rounded w-2/3"></div>
                            <div className="h-4 bg-slate-700 rounded w-4/5"></div>
                        </div>
                        <div className="absolute inset-0 flex items-center justify-center">
                            <div className="text-center px-4">
                                <div className="text-2xl mb-2">🔒</div>
                                <h3 className="text-lg font-bold text-white mb-2">Unlock DeepSeek AI Purchase Protection</h3>
                                <p className="text-xs text-slate-400 mb-4 max-w-sm">
                                    Get exact insole / chest / waist targets, platform-specific warnings (Taobao vs Poizon), and a ready-to-send Chinese message to verify with the seller.
                                </p>
                                <a
                                    href={CREEM_PAYMENT_URL}
                                    className="inline-block px-6 py-2.5 rounded-lg bg-china-red hover:bg-red-700 font-semibold text-sm text-white shadow-lg shadow-red-600/30 transition active:scale-95"
                                >
                                    Unlock Lifetime Pass for $4.99
                                </a>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
                    <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg bg-china-red flex items-center justify-center font-bold text-white shadow-md shadow-red-500/20">AI</div>
                                <span className="text-xl font-bold tracking-tight text-white">ChinaFit <span className="china-red">AI</span></span>
                            </div>
                            {isProUser ? (
                                <span className="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                    <span className="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span>
                                    Lifetime Pro Active
                                </span>
                            ) : (
                                <a
                                    href={CREEM_PAYMENT_URL}
                                    className="px-4 py-2 rounded-full bg-china-red text-white text-xs sm:text-sm font-semibold hover:bg-red-700 transition-all shadow-lg shadow-red-600/30 active:scale-95"
                                >
                                    Get Pro Pass ($4.99)
                                </a>
                            )}
                        </div>
                    </header>

                    <main className="flex-grow flex items-center justify-center py-10 px-4">
                        <div className="w-full max-w-2xl">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Smart Cross-Border Size Calculator</h1>
                                <p className="text-slate-400 mt-2 text-sm sm:text-base">Never buy the wrong size from Chinese shopping platforms again.</p>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
                                <div className="flex rounded-xl bg-slate-950 p-1 mb-8 border border-slate-800">
                                    <button onClick={() => handleTabChange('shoes', 260, 95)} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'shoes' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>👟 Shoes</button>
                                    <button onClick={() => handleTabChange('tops', 175, 70)} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'tops' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>👕 Tops</button>
                                    <button onClick={() => handleTabChange('pants', 175, 75)} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${activeTab === 'pants' ? 'bg-china-red text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>👖 Pants</button>
                                </div>

                                <form onSubmit={handleCalculate} className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                            {activeTab === 'shoes' ? 'Foot Length (mm)' : 'Height (cm)'}
                                        </label>
                                        <input type="number" value={inputVal1} onChange={(e) => setInputVal1(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors" placeholder={activeTab === 'shoes' ? 'e.g. 260' : 'e.g. 175'} required min="1" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                            {activeTab === 'shoes' ? 'Foot Width (mm)' : activeTab === 'tops' ? 'Weight (kg)' : 'Waist (cm)'}
                                        </label>
                                        <input type="number" value={inputVal2} onChange={(e) => setInputVal2(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-red-600 transition-colors" placeholder={activeTab === 'shoes' ? 'e.g. 95' : activeTab === 'tops' ? 'e.g. 70' : 'e.g. 75'} required min="1" />
                                    </div>
                                    <div className="sm:col-span-2 mt-2">
                                        <button type="submit" disabled={loading} className="w-full py-3.5 rounded-xl bg-china-red text-white font-bold hover:bg-red-700 transition-all flex items-center justify-center space-x-2 shadow-lg shadow-red-600/30 disabled:opacity-60 disabled:cursor-not-allowed active:scale-[0.99]">
                                            {loading ? (
                                                <>
                                                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                                    </svg>
                                                    <span>DeepSeek AI Analyzing...</span>
                                                </>
                                            ) : (
                                                <span>Get Size Recommendation</span>
                                            )}
                                        </button>
                                    </div>
                                </form>

                                {errorMsg && (
                                    <div className="mt-4 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm">⚠️ {errorMsg}</div>
                                )}

                                {result && !loading && (
                                    <div className="mt-8 pt-6 border-t border-slate-800 space-y-6 animate-fade-in">
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="text-xs uppercase font-semibold tracking-wider text-slate-400 mb-1">Recommended Size</div>
                                            <div className="text-3xl font-black text-white">{result.baseResult?.recommendedSize}</div>
                                            <p className="text-sm text-slate-400 mt-2">{result.baseResult?.quickTip}</p>
                                            {result.baseResult?.confidence && (
                                                <p className="text-xs text-slate-500 mt-1 font-medium">Confidence: {result.baseResult.confidence}</p>
                                            )}
                                        </div>

                                        {result.isPro ? (
                                            <>
                                                <div className="bg-gradient-to-br from-slate-900 to-slate-950 p-6 rounded-xl border border-red-500/40 shadow-xl">
                                                    <div className="flex items-center justify-between text-red-400 text-sm font-bold mb-4 pb-2 border-b border-slate-800">
                                                        <div className="flex items-center space-x-2">
                                                            <span>✨ DeepSeek AI Expert Deep Breakdown</span>
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <button onClick={handleShare} className="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                                                                Share
                                                            </button>
                                                            <button onClick={copyReport} className="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                                                                {copied ? '✓ Copied' : '📋 Copy Full Report'}
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div className="markdown-content" dangerouslySetInnerHTML={{ __html: getHtmlContent(result.proAnalysis) }} />
                                                </div>

                                                {sellerMsgSection && (
                                                    <div className="bg-slate-900 p-5 rounded-xl border border-emerald-500/30 shadow-lg">
                                                        <div className="flex items-center justify-between mb-3">
                                                            <h3 className="text-sm font-bold text-emerald-400">💬 Seller Message Template (Copy-Paste to Taobao/1688)</h3>
                                                            <button onClick={copySellerMsg} className="px-3 py-1 text-xs font-semibold rounded bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 transition">
                                                                {sellerMsgCopied ? '✓ Copied' : '📋 Copy Chinese'}
                                                            </button>
                                                        </div>
                                                        <div className="text-sm text-slate-300 bg-slate-950 p-3 rounded-lg border border-slate-800 whitespace-pre-wrap leading-relaxed">
                                                            {sellerMsgSection}
                                                        </div>
                                                        <p className="text-xs text-slate-500 mt-2">
                                                            <span className="font-semibold text-slate-400">📏 Quick Reference:</span> {getQuickReference()}
                                                        </p>
                                                    </div>
                                                )}
                                            </>
                                        ) : (
                                            renderPreview()
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* FAQ 可见内容区块，提升 SEO 和用户信任 */}
                    <section className="max-w-2xl mx-auto px-4 py-10">
